name: Deploy page (and optional API sweep)

# The daily price sweep is done by a scheduled Claude task on Tom's PC (Anysite
# MCP), which pushes prices.json / changelog.json to main. Every push to main
# redeploys GitHub Pages here. The "sweep" job only runs on a manual start and
# only when an ANYSITE_API_KEY secret exists (Anysite API plan) — otherwise it
# is skipped and the page is just redeployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep prices (only with an Anysite API key)
        env:
          ANYSITE_API_KEY: ${{ secrets.ANYSITE_API_KEY }}
        run: |
          if [ -z "$ANYSITE_API_KEY" ]; then
            echo "No ANYSITE_API_KEY secret — skipping the API sweep (the Claude task does the daily sweep)."
            exit 0
          fi
          python3 tools/sweep.py
      - name: Commit prices.json / changelog.json
        run: |
          git config user.name "dmz-price-bot"
          git config user.email "dmz-price-bot@users.noreply.github.com"
          git add prices.json changelog.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Price sweep $(TZ=Europe/Brussels date +%F)"
            git push
          fi

  deploy:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
