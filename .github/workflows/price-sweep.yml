name: Price sweep & deploy

on:
  schedule:
    # 06:03 Brussels: 04:03 UTC in summer (CEST), 05:03 UTC in winter (CET).
    # Both slots fire; the gate step lets only the one that lands at 06:xx local run.
    - cron: "3 4 * * *"
    - cron: "3 5 * * *"
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # any manual upload/edit redeploys the page

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.gate.outputs.go }}
    steps:
      - name: Gate — only at 06:xx Brussels (or when started by hand)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Brussels date +%H)" = "06" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "Not the 06:00 Brussels slot — skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Sweep prices (Anysite API)
        if: steps.gate.outputs.go == '1'
        env:
          ANYSITE_API_KEY: ${{ secrets.ANYSITE_API_KEY }}
        run: python3 tools/sweep.py

      - name: Commit prices.json / changelog.json
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "dmz-price-bot"
          git config user.email "dmz-price-bot@users.noreply.github.com"
          git add prices.json changelog.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Price sweep $(TZ=Europe/Brussels date +%F)"
            git push
          fi

  deploy:
    needs: sweep
    if: always() && (github.event_name == 'push' || needs.sweep.outputs.ran == '1')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
